name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build game (single-file bundle)
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Upload completion and the artifact listing can become visible at different
      # times. deploy-pages looks up the artifact via the REST API, so wait until
      # that same API can actually find it rather than racing it on a fresh run.
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | length') || exit 1
            if [ "$count" -ge 1 ]; then
              echo "Pages artifact available after ${attempt} checks"
              exit 0
            fi
            echo "Waiting for Pages artifact (${attempt}/30)"
            sleep 5
          done
          echo "::error::Pages artifact was not visible in the GitHub API after 150 seconds"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
